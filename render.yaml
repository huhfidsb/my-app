services:
  - type: web
    name: my-app
    env: node
    plan: free
    buildCommand: npm install --include=dev
    startCommand: npm start
    envVars:
      - key: PORT
        value: 8888
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
